function anim(){let b=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=b.width*d;cv.height=b.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,b.width,b.height);if(moving){t=(t+.006)%1;if(mode==='series'){for(let k=0;k<4;k++){let p=(t+k/4)%1;ar(b.width*(.08+.43*p),b.height*.225,0,'#075fca')}}else{for(let x of [.07,.22,.44])for(let k=0;k<2;k++){let p=(t+k/2)%1;ar(b.width*x,b.height*(.20+.58*p),Math.PI/2,'#16843b')}}}requestAnimationFrame(anim)}render();anim();
