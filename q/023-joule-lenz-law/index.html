<html lang="bg"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR-023 – Закон на Джаул–Ленц</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#174a70,#061322 65%);color:#f4f9ff;font-family:Segoe UI,Arial}.w{max-width:1150px;margin:auto;padding:14px}h1{text-align:center;margin:4px}.sub{text-align:center;color:#bed0df;margin:8px 0 14px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}.stage,.side{background:#0d2236;border:1px solid #426582;border-radius:20px}.stage{min-height:620px;position:relative;overflow:hidden}.side{padding:12px}.card{background:#ffffff08;border:1px solid #3d607e;border-radius:14px;padding:11px;margin-bottom:10px}.eq{text-align:center;font:800 26px Georgia;color:#ffe26b}.result{font-weight:800;line-height:1.55;color:#7eeaa0}label{display:flex;justify-content:space-between;font-weight:800;margin:7px 0}input{width:100%}button{width:100%;padding:11px;margin:5px 0;border:0;border-radius:11px;background:#2468a8;color:white;font-weight:850;cursor:pointer}.hot{background:#b84a30}.note{color:#bed0df;font-size:13px;line-height:1.5}svg{position:absolute;width:100%;height:100%}.wire{stroke:#e1ebf1;stroke-width:6;fill:none;stroke-linecap:round}.lab{fill:white;font-size:18px;font-weight:800}.small{fill:#c9dae7;font-size:14px;font-weight:700}.e{fill:#50d9ff;stroke:white}.et{fill:#062038;font-size:9px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.heat{fill:none;stroke:#ff8c42;stroke-linecap:round}@media(max-width:800px){.grid{grid-template-columns:1fr}.stage{min-height:560px}}</style></head>
<body><div class="w"><h1>QR-023 – Закон на Джаул–Ленц</h1><div class="sub">Превръщане на електрическата енергия в топлина</div><div class="grid"><div class="stage">
<svg viewBox="0 0 800 620"><defs><filter id="gl"><fegaussianblur stdDeviation="7" result="b"></fegaussianblur><femerge><femergenode in="b"></femergenode><femergenode in="SourceGraphic"></femergenode></femerge></filter></defs>
<!-- closed circuit -->
<path class="wire" d="M145 165 H300 M500 165 H665 V465 H145 V165"></path>
<!-- battery -->
<rect x="98" y="250" width="94" height="170" rx="17" fill="#dce7ed" stroke="#6f8ea2" stroke-width="3"></rect>
<rect x="112" y="232" width="28" height="20" rx="4" fill="#e54d42"></rect><rect x="151" y="232" width="28" height="20" rx="4" fill="#37444d"></rect>
<rect x="111" y="282" width="68" height="88" rx="8" fill="#23394d"></rect><text x="145" y="316" class="lab" text-anchor="middle">DC</text><text x="126" y="226" class="lab">+</text><text x="161" y="226" class="lab">−</text>
<path class="wire" d="M145 165 V232 M145 420 V465"></path>
<!-- heater -->
<rect id="heater" x="300" y="130" width="200" height="70" rx="14" fill="rgb(233,153,55)" stroke="#67331e" stroke-width="3" filter=""></rect>
<path d="M320 165l20-20 25 40 25-40 25 40 25-40 25 40 15-20" fill="none" stroke="#6a321c" stroke-width="5"></path>
<text x="400" y="112" class="lab" text-anchor="middle">Нагревателен резистор R</text>
<path id="h1" d="M340 120c-15-20 15-35 0-58" class="heat" style="opacity: 0.325; stroke-width: 3.7;"></path><path id="h2" d="M400 120c-15-20 15-38 0-65" class="heat" style="opacity: 0.325; stroke-width: 3.7;"></path><path id="h3" d="M460 120c-15-20 15-35 0-58" class="heat" style="opacity: 0.325; stroke-width: 3.7;"></path>
<text x="400" y="35" class="lab" text-anchor="middle">Отделена топлина Q</text>
<text x="400" y="535" class="small" text-anchor="middle">Токът преминава през съпротивлението → проводникът се нагрява.</text>
<text id="temp" x="400" y="575" class="lab" text-anchor="middle">Относително нагряване: ниско</text><g id="els"><circle cx="621.3999999999845" cy="465" r="7" class="e"></circle><text x="621.3999999999845" y="465" class="et">e−</text><circle cx="555.5666666666511" cy="465" r="7" class="e"></circle><text x="555.5666666666511" y="465" class="et">e−</text><circle cx="489.733333333318" cy="465" r="7" class="e"></circle><text x="489.733333333318" y="465" class="et">e−</text><circle cx="423.89999999998463" cy="465" r="7" class="e"></circle><text x="423.89999999998463" y="465" class="et">e−</text><circle cx="358.06666666665126" cy="465" r="7" class="e"></circle><text x="358.06666666665126" y="465" class="et">e−</text><circle cx="292.2333333333179" cy="465" r="7" class="e"></circle><text x="292.2333333333179" y="465" class="et">e−</text><circle cx="226.3999999999844" cy="465" r="7" class="e"></circle><text x="226.3999999999844" y="465" class="et">e−</text><circle cx="160.56666666665114" cy="465" r="7" class="e"></circle><text x="160.56666666665114" y="465" class="et">e−</text><circle cx="150.26666666668223" cy="165" r="7" class="e"></circle><text x="150.26666666668223" y="165" class="et">e−</text><circle cx="216.1000000000153" cy="165" r="7" class="e"></circle><text x="216.1000000000153" y="165" class="et">e−</text><circle cx="281.93333333334897" cy="165" r="7" class="e"></circle><text x="281.93333333334897" y="165" class="et">e−</text><circle cx="547.7666666666821" cy="165" r="7" class="e"></circle><text x="547.7666666666821" y="165" class="et">e−</text><circle cx="613.6000000000154" cy="165" r="7" class="e"></circle><text x="613.6000000000154" y="165" class="et">e−</text><circle cx="665" cy="179.4333333333488" r="7" class="e"></circle><text x="665" y="179.4333333333488" class="et">e−</text><circle cx="665" cy="245.2666666666821" r="7" class="e"></circle><text x="665" y="245.2666666666821" class="et">e−</text><circle cx="665" cy="311.1000000000155" r="7" class="e"></circle><text x="665" y="311.1000000000155" class="et">e−</text><circle cx="665" cy="376.9333333333486" r="7" class="e"></circle><text x="665" y="376.9333333333486" class="et">e−</text><circle cx="665" cy="442.7666666666822" r="7" class="e"></circle><text x="665" y="442.7666666666822" class="et">e−</text></g></svg></div>
<div class="side"><div class="card"><label>Ток I <b id="io">2.0 A</b></label><input id="I" type="range" min=".5" max="8" step=".1" value="2"><label>Съпротивление R <b id="ro">10 Ω</b></label><input id="R" type="range" min="1" max="30" step="1" value="10"><label>Време t <b id="to">10 s</b></label><input id="T" type="range" min="1" max="60" step="1" value="10"></div>
<div class="card eq">Q = I²Rt</div><div id="calc" class="card result">Q = 2.0² × 10 × 10<br>Q = 400.0 J<br><span style="color:#ffe26b">P = I²R = 40.0 W</span></div><div class="card"><button class="hot" id="dbl">Удвои тока</button><button id="rst">Начални стойности</button></div><div id="cmp" class="card" style="display:none"></div><div class="card note"><b>Наблюдение:</b> при неизменни R и t, ако токът се увеличи два пъти, топлината се увеличава четири пъти.<div class="eq" style="font-size:20px">I × 2 → Q × 4</div></div></div></div></div>
<script>
const $=x=>document.getElementById(x),NS="http://www.w3.org/2000/svg";let ph=0;
function upd(){let i=+$("I").value,r=+$("R").value,t=+$("T").value,q=i*i*r*t,p=i*i*r;$("io").textContent=i.toFixed(1)+" A";$("ro").textContent=r+" Ω";$("to").textContent=t+" s";$("calc").innerHTML=`Q = ${i.toFixed(1)}² × ${r} × ${t}<br>Q = ${q.toFixed(1)} J<br><span style="color:#ffe26b">P = I²R = ${p.toFixed(1)} W</span>`;let z=Math.min(1,p/400),rr=Math.round(230+25*z),gg=Math.round(162-95*z),bb=Math.round(58-35*z);$("heater").setAttribute("fill",`rgb(${rr},${gg},${bb})`);$("heater").setAttribute("filter",z>.35?"url(#gl)":"");["h1","h2","h3"].forEach(x=>{$(x).style.opacity=.25+.75*z;$(x).style.strokeWidth=3+7*z});$("temp").textContent="Относително нагряване: "+(z<.2?"ниско":z<.55?"средно":"високо")}
function anim(){ph=(ph+.003*(+$("I").value))%1;let g=$("els");g.innerHTML="";let S=[[145,165,300,165],[500,165,665,165],[665,165,665,465],[665,465,145,465],[145,465,145,420]],L=S.map(s=>Math.hypot(s[2]-s[0],s[3]-s[1])),tot=L.reduce((a,b)=>a+b);for(let n=0;n<18;n++){let d=((n/18+ph)%1)*tot,k=0;while(d>L[k]){d-=L[k];k++}let s=S[k],u=d/L[k],x=s[0]+(s[2]-s[0])*u,y=s[1]+(s[3]-s[1])*u,c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",7);c.setAttribute("class","e");g.appendChild(c);let tx=document.createElementNS(NS,"text");tx.setAttribute("x",x);tx.setAttribute("y",y);tx.setAttribute("class","et");tx.textContent="e−";g.appendChild(tx)}requestAnimationFrame(anim)}
["I","R","T"].forEach(x=>$(x).oninput=()=>{$("cmp").style.display="none";upd()});$("rst").onclick=()=>{$("I").value=2;$("R").value=10;$("T").value=10;$("cmp").style.display="none";upd()};$("dbl").onclick=()=>{let a=+$("I").value,q1=a*a*(+$("R").value)*(+$("T").value),b=Math.min(8,a*2);$("I").value=b;upd();let q2=b*b*(+$("R").value)*(+$("T").value);$("cmp").style.display="block";$("cmp").innerHTML=`Преди: I = ${a.toFixed(1)} A → Q = ${q1.toFixed(1)} J<br>След: I = ${b.toFixed(1)} A → Q = ${q2.toFixed(1)} J<br><b style="color:#ffe26b">Q се увеличи ${(q2/q1).toFixed(1)} пъти.</b>`};upd();anim();
</script></body></html>
