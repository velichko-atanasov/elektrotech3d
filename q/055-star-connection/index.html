<script>
const ov=document.getElementById('ov'), ph=document.getElementById('ph');
const oc=ov.getContext('2d'), pc=ph.getContext('2d');
const U=document.getElementById('u'), UV=document.getElementById('uv'), CALC=document.getElementById('calc');
let mode=0, theta=0, last=0;
const colors=['#d52b1e','#19823b','#2459b3'], ink='#1b2430';

function fit(c,ctx){
  const r=c.getBoundingClientRect(),d=devicePixelRatio||1;
  c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);
}
function line(ctx,x1,y1,x2,y2,col=ink,w=2,dash=[]){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,col=ink,w=2){
  line(ctx,x1,y1,x2,y2,col,w);
  const a=Math.atan2(y2-y1,x2-x1),q=9;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-q*Math.cos(a-.45),y2-q*Math.sin(a-.45));
  ctx.lineTo(x2-q*Math.cos(a+.45),y2-q*Math.sin(a+.45));ctx.closePath();ctx.fill();
}
function text(ctx,t,x,y,size=16,col=ink,align='center',weight='normal'){
  ctx.save();ctx.fillStyle=col;ctx.font=`${weight} ${size}px Arial`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y);ctx.restore();
}
function dot(ctx,x,y,r=4,col=ink){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}

function drawOverlay(){
  const w=ov.clientWidth,h=ov.clientHeight;oc.clearRect(0,0,w,h);

  // Approximate coordinates aligned to the original uploaded diagram.
  const ys=[h*.255,h*.43,h*.605], yN=h*.79;
  const x1=w*.30, x2=w*.70;

  if(mode===1){
    // Фазови напрежения към N + формули до стрелките
    for(let i=0;i<3;i++){
      const x=w*(.40+i*.075);
      arrow(oc,x,yN-10,x,ys[i]+10,colors[i],2.2);
      const nm=['UAN','UBN','UCN'][i];
      text(oc,nm,x+26,(yN+ys[i])/2-12,15,colors[i],'left','bold');
      text(oc,'= Uф',x+26,(yN+ys[i])/2+12,14,colors[i],'left','bold');
    }
    text(oc,'|UAN| = |UBN| = |UCN| = Uф',w*.50,h*.10,16,'#173f70','center','bold');
  }

  if(mode===2){
    // Линейни напрежения между фазите + връзка с фазовото
    arrow(oc,w*.43,ys[1]-8,w*.43,ys[0]+8,colors[0],2.3);
    text(oc,'UAB',w*.43+28,(ys[0]+ys[1])/2-10,15,colors[0],'left','bold');
    text(oc,'= √3·Uф',w*.43+28,(ys[0]+ys[1])/2+13,14,colors[0],'left','bold');

    arrow(oc,w*.54,ys[2]-8,w*.54,ys[1]+8,colors[1],2.3);
    text(oc,'UBC',w*.54+28,(ys[1]+ys[2])/2-10,15,colors[1],'left','bold');
    text(oc,'= √3·Uф',w*.54+28,(ys[1]+ys[2])/2+13,14,colors[1],'left','bold');

    text(oc,'Uл = √3 · Uф',w*.50,h*.10,18,'#173f70','center','bold');
  }

  if(mode===3){
    // Еднопосочно движение: progress расте от 0 до 1 и се връща в началото без движение назад.
    const progress=(theta/(Math.PI*2))%1;
    for(let i=0;i<3;i++){
      const local=(progress + i/3)%1;
      const xa=x1+(x2-x1)*local;
      arrow(oc,xa-28,ys[i]-13,xa+28,ys[i]-13,colors[i],2.4);
      const nm=['IA','IB','IC'][i];
      text(oc,nm,xa,ys[i]-31,14,colors[i],'center','bold');
    }
    text(oc,'Iл = Iф',w*.50,h*.10,18,'#173f70','center','bold');
    text(oc,'IN = 0  (при симетричен товар)',w*.50,yN+18,15,ink,'center','bold');
  }

  if(mode===0){
    // Три цветни маркера се движат само от източника към товара.
    const progress=(theta/(Math.PI*2))%1;
    for(let i=0;i<3;i++){
      const local=(progress + i/3)%1;
      const xa=x1+(x2-x1)*local;
      dot(oc,xa,ys[i],5,colors[i]);
    }
  }
}

function drawPhasor(){
  const w=ph.clientWidth,h=ph.clientHeight;pc.clearRect(0,0,w,h);
  const ox=w/2,oy=h*.53,R=Math.min(w,h)*.32,u=+U.value,ul=Math.sqrt(3)*u;
  line(pc,25,oy,w-25,oy,'#dce3ea',1); line(pc,ox,35,ox,h-28,'#dce3ea',1);

  if(mode===2){
    text(pc,'Линейни напрежения',ox,20,18,'#173f70','center','bold');
    const a=[Math.PI/6,-Math.PI/2,5*Math.PI/6], names=['UAB','UBC','UCA'];
    a.forEach((v,i)=>{v+=theta*.18;arrow(pc,ox,oy,ox+R*Math.cos(v),oy-R*Math.sin(v),colors[i],3);text(pc,names[i],ox+(R+24)*Math.cos(v),oy-(R+24)*Math.sin(v),14,colors[i])});
    text(pc,ul.toFixed(1)+' V',ox,h-14,16,ink);
  }else{
    text(pc,mode===3?'Фазови токове':'Фазови напрежения',ox,20,18,'#173f70','center','bold');
    const a=[0,-2*Math.PI/3,2*Math.PI/3], names=mode===3?['IA','IB','IC']:['UAN','UBN','UCN'];
    a.forEach((v,i)=>{v+=theta*.18;arrow(pc,ox,oy,ox+R*Math.cos(v),oy-R*Math.sin(v),colors[i],3);text(pc,names[i],ox+(R+24)*Math.cos(v),oy-(R+24)*Math.sin(v),14,colors[i])});
    text(pc,'120°',ox+34,oy+43,14,ink);
    if(mode!==3) text(pc,u+' V',ox,h-14,16,ink);
  }
  dot(pc,ox,oy,3,ink);
}

function draw(){
  UV.textContent=U.value+' V';
  CALC.textContent=`При Uф = ${U.value} V → Uл = ${(Math.sqrt(3)*U.value).toFixed(1)} V`;
  const info=document.getElementById('info');
  if(mode===1) info.innerHTML='<b>Фазови напрежения:</b> |ŪAN| = |ŪBN| = |ŪCN| = Uф и са отместени на 120°.';
  else if(mode===2) info.innerHTML='<b>Линейни напрежения:</b> Uл = √3·Uф. При Uф = '+U.value+' V получаваме Uл ≈ '+(Math.sqrt(3)*U.value).toFixed(1)+' V.';
  else if(mode===3) info.innerHTML='<b>Токове при звезда:</b> Iл = Iф. При симетричен товар ĪA + ĪB + ĪC = 0 и IN = 0.';
  else info.innerHTML='<b>Симетричен товар:</b> ĪA + ĪB + ĪC = 0, следователно IN = 0.';
  drawOverlay();drawPhasor();
}

document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{
  mode=+b.dataset.mode;
  document.querySelectorAll('button[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
  draw();
});
U.oninput=draw;

function resize(){fit(ov,oc);fit(ph,pc);draw()}
window.addEventListener('resize',resize);resize();

function loop(ts){
  if(document.getElementById('animate').checked) theta += Math.min((ts-last)/1000,0.04)*1.4;
  last=ts;draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body></html>
