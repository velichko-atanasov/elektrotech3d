   for(let i=0;i<=W/2;i+=3){let y=250+amp*Math.sin(i/(W/2)*Math.PI);dn+=` L${x0+W/2+i},${y}`}
   dn+=` L${x0+W},250 Z`;
   g.appendChild(E("path",{d:dp,class:"posfill"}));g.appendChild(E("path",{d:dn,class:"negfill"}));
   text(g,355,165,"+","lab");text(g,625,335,"−","lab");
   line(g,x0,80,x0,405,"guide");line(g,x0+W,80,x0+W,405,"guide");
   text(g,(x0+x0+W)/2,75,"T","lab");
   $("ttl").textContent="Средна стойност за един период";
   $("desc").innerHTML="За симетрична синусоида положителната и отрицателната полувълна за един пълен период се компенсират. Следователно средната стойност е <b>нула</b>. Това не означава, че ефективната стойност е нула.";
   $("eq").innerHTML='U<sub>ср</sub> = <span class="frac"><span class="top">1</span><span class="bot">T</span></span> ∫₀ᵀ u(t) dt = 0';
 }
}
