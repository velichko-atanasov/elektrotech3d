 y2="440.3797563847742"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="488.71308971810765" x2="780" y2="508.71308971810765"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="147.04642305144077" x2="780" y2="167.04642305144077"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="215.37975638477423" x2="780" y2="235.37975638477423"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="283.71308971810765" x2="780" y2="303.71308971810765"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="352.0464230514408" x2="780" y2="372.0464230514408"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="420.3797563847742" x2="780" y2="440.3797563847742"></line></g>

<div id="info" class="info"><b>Обобщение.</b> Схемата съдържа два възела A и B, три клона и три затворени контура. Червените стрелки показват клоновите токове <b>I₁, I₂, I₃</b>, а цветните стрелки – контурните токове <b>Iк₁, Iк₂, Iк₃</b>.</div>
</div>

<script>
const $=id=>document.getElementById(id);
const info=$('info');
const nodeEls=[$('haloA'),$('haloB'),$('nodeTagA'),$('nodeTagB')];
const branchEls=[$('br1'),$('br2'),$('br3'),$('brt1'),$('brt2'),$('brt3')];
const loopEls=[$('loop1'),$('loop2'),$('loop3'),$('loopt1'),$('loopt2'),$('loopt3'),$('meshA1'),$('meshT1'),$('meshA2'),$('meshT2'),$('meshA3a'),$('meshT3')];
const buttons=[$('nodesBtn'),$('branchesBtn'),$('loopsBtn'),$('allBtn')];

function off(){
  buttons.forEach(b=>b.classList.remove('on'));
  nodeEls.forEach(e=>{e.style.opacity=0;e.classList.remove('pulse')});
  branchEls.forEach(e=>{e.style.opacity=0;e.classList.remove('pulse')});
  loopEls.forEach(e=>{e.style.opacity=0;e.classList.remove('flow','pulse')});
}
$('nodesBtn').onclick=()=>{
  off(); $('nodesBtn').classList.add('on');
  nodeEls.forEach(e=>{e.style.opacity=1;e.classList.add('pulse')});
  info.innerHTML='<b>Възел.</b> Точка или съвкупност от непосредствено свързани точки, в която се съединяват три или повече клона. На схемата възлите са A и B.';
};
$('branchesBtn').onclick=()=>{
  off(); $('branchesBtn').classList.add('on');
  branchEls.forEach(e=>{e.style.opacity=1;e.classList.add('pulse')});
  info.innerHTML='<b>Клон.</b> Участък между два възела, през всички елементи на който протича един и същ ток. Показани са Клон 1 (R₁, E₁), Клон 2 (R₂) и Клон 3 (R₃, E₂).';
};
$('loopsBtn').onclick=()=>{
  off(); $('loopsBtn').classList.add('on');
  loopEls.forEach(e=>{e.style.opacity=1;e.classList.add('flow')});
  info.innerHTML='<b>Контур.</b> Затворен път, образуван от последователно свързани клони. Посоките на контурните токове са зададени условно по часовниковата стрелка и са означени с <b>Iк₁</b>, <b>Iк₂</b> и <b>Iк₃</b>. Цветът на всеки контурен ток съответства на цвета на неговия контур. Червените <b>I₁, I₂, I₃</b> са клонови токове.';
};
$('allBtn').onclick=()=>{
  off(); $('allBtn').classList.add('on');
  nodeEls.forEach(e=>{e.style.opacity=1;e.classList.add('pulse')});
  branchEls.forEach(e=>{e.style.opacity=.95});
  loopEls.forEach(e=>{e.style.opacity=.85;e.classList.add('flow')});
  info.innerHTML='<b>Обобщение.</b> Схемата съдържа два възела A и B, три клона и три затворени контура. Червените стрелки показват клоновите токове <b>I₁, I₂, I₃</b>, а цветните стрелки – контурните токове <b>Iк₁, Iк₂, Iк₃</b>.';
};
$('clearBtn').onclick=()=>{
  off();
  info.innerHTML='<b>Разклонена електрическа верига.</b> Чиста схема с два възела A и B и три клона.';
};

/* Animated conventional-current arrows.
   I1 enters node A; I2 and I3 leave node A, illustrating I1 = I2 + I3. */
const flowG=$('currentFlow');
const NS='http://www.w3.org/2000/svg';

const currentPaths=[
  {id:'I₁', pts:[[220,500],[220,110]], speed:0.22},
  {id:'I₂', pts:[[500,110],[500,520]], speed:0.22},
  {id:'I₃', pts:[[780,110],[780,520]], speed:0.22}
];

function interpFlow(pts,t){
  let lens=[],total=0;
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1];
    const l=Math.hypot(dx,dy); lens.push(l); total+=l;
  }
  let d=(t%1)*total;
  for(let i=0;i<lens.length;i++){
    if(d<=lens[i]){
      const a=pts[i],b=pts[i+1],u=d/lens[i];
      return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
    }
    d-=lens[i];
  }
  return pts[pts.length-1];
}

const movers=[];
currentPaths.forEach((p,pi)=>{
  // Two moving arrow+I markers per branch.
  for(let j=0;j<2;j++){
    const group=document.createElementNS(NS,'g');

    const shaft=document.createElementNS(NS,'line');
    shaft.setAttribute('stroke','#d62020');
    shaft.setAttribute('stroke-width','2.4');
    shaft.setAttribute('marker-end','url(#arrRed)');
    group.appendChild(shaft);

    const label=document.createElementNS(NS,'text');
    label.setAttribute('fill','#d62020');
    label.setAttribute('font-size','17');
    label.setAttribute('font-weight','700');
    label.textContent=p.id;
    group.appendChild(label);

    flowG.appendChild(group);
    movers.push({group,shaft,label,p,phase:j/2});
  }
});


// Additional small red arrows without labels.
// They circulate continuously in the same conventional-current direction.
const smallMovers=[];
currentPaths.forEach((p,pi)=>{
  for(let j=0;j<6;j++){
    const shaft=document.createElementNS(NS,'line');
    shaft.setAttribute('stroke','#d62020');
    shaft.setAttribute('stroke-width','1.8');
    shaft.setAttribute('marker-end','url(#arrRed)');
    shaft.setAttribute('opacity','0.88');
    flowG.appendChild(shaft);
    smallMovers.push({shaft,p,phase:(j+0.25)/6});
  }
});

let flowStart=performance.now();
function animateCurrent(now){
  const T=(now-flowStart)/1000;
  movers.forEach(o=>{
    const t=o.phase+T*o.p.speed;
    const [x,y]=interpFlow(o.p.pts,t);
    const [x2,y2]=interpFlow(o.p.pts,t+0.035);

    // Arrow points in the conventional-current direction.
    const dx=x2-x, dy=y2-y;
    const len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    const half=16;

    o.shaft.setAttribute('x1',x-ux*half);
    o.shaft.setAttribute('y1',y-uy*half);
    o.shaft.setAttribute('x2',x+ux*half);
    o.shaft.setAttribute('y2',y+uy*half);

    o.label.setAttribute('x',x+18);
    o.label.setAttribute('y',y+6);
  });

  smallMovers.forEach(o=>{
    const t=o.phase+T*(o.p.speed*1.18);
    const [x,y]=interpFlow(o.p.pts,t);
    const [x2,y2]=interpFlow(o.p.pts,t+0.028);
    const dx=x2-x, dy=y2-y;
    const len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    const half=10;
    o.shaft.setAttribute('x1',x-ux*half);
    o.shaft.setAttribute('y1',y-uy*half);
    o.shaft.setAttribute('x2',x+ux*half);
    o.shaft.setAttribute('y2',y+uy*half);
  });

  requestAnimationFrame(animateCurrent);
}
requestAnimationFrame(animateCurrent);
</script>
