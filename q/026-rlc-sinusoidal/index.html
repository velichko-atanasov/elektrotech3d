<line x1="745" y1="350" x2="745" y2="590" class="axis"></line>
<line id="phasorU" x1="745" y1="470" x2="817.1876408112652" y2="527.0345905052694" class="phU" marker-end="url(#arrU)"></line>
<line id="phasorI" x1="745" y1="470" x2="804.6332684962625" y2="517.1155312869616" class="phI" marker-end="url(#arrI)"></line>
<text id="uPhLab" x="833.1876408112652" y="513.0345905052694" fill="#ff6b5e" font-size="16" font-weight="900">U</text>
<text id="iPhLab" x="820.6332684962625" y="539.1155312869616" fill="#55c7ff" font-size="16" font-weight="900">I</text>
<text id="phasorNote" x="745" y="625" class="gold" text-anchor="middle">U и I са в една фаза</text>
</svg>
</section>

<aside class="side">
<div class="card">
<div class="title">Общи параметри</div>
<label>Ефективно напрежение U <b id="Uout">230 V</b></label>
<input id="U" type="range" min="100" max="250" step="1" value="230">
<label>Честота f <b id="Fout">50 Hz</b></label>
<input id="F" type="range" min="10" max="100" step="1" value="50">
</div>

<div class="card" id="paramCard">
<div class="title" id="paramTitle">Съпротивление R</div>
<label id="paramLabel">R <b id="Pout">100 Ω</b></label>
<input id="P" type="range" min="20" max="500" step="5" value="100">
</div>

<div class="card eq" id="formula">I = U/R<br>φ = 0°</div>
<div class="card result" id="results">R = 100.0 Ω<br>I = 2.300 A<br>φ = 0°</div>
<div class="card note" id="explain"><b>Резистор:</b> токът и напрежението са в една фаза. Максимумите и нулевите им стойности настъпват едновременно.</div>

<div class="card">
<button class="ctrl" id="preset">Базови стойности</button>
<button class="ctrl" id="pause">Пауза</button>
</div>
</aside>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let mode="R",theta=0,last=performance.now(),running=true;
const state={
 R:{p:100,min:20,max:500,step:5},
 L:{p:0.318,min:0.02,max:1.0,step:0.002},
 C:{p:31.8,min:2,max:200,step:0.2}
};

function configure(){
 ["Rdraw","Ldraw","Cdraw"].forEach(id=>$(id).style.display=id[0]===mode?"":"none");
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
 const s=state[mode], p=$("P");
 p.min=s.min;p.max=s.max;p.step=s.step;p.value=s.p;
 if(mode==="R"){
  $("paramTitle").textContent="Съпротивление R";
  $("paramLabel").firstChild.textContent="R ";
 }else if(mode==="L"){
  $("paramTitle").textContent="Индуктивност L";
  $("paramLabel").firstChild.textContent="L ";
 }else{
  $("paramTitle").textContent="Капацитет C";
  $("paramLabel").firstChild.textContent="C ";
 }
 update();
}

function values(){
 let U=+$("U").value,f=+$("F").value,p=+$("P").value,w=2*Math.PI*f,X=0,I=0,phi=0;
 if(mode==="R"){X=p;I=U/p;phi=0}
 if(mode==="L"){X=w*p;I=U/X;phi=-Math.PI/2}
 if(mode==="C"){X=1/(w*p*1e-6);I=U/X;phi=Math.PI/2}
 return {U,f,p,w,X,I,phi};
}

function update(){
 state[mode].p=+$("P").value;
 const v=values();
 $("amm").style.display="";
 $("Uout").textContent=v.U.toFixed(0)+" V"; $("Fout").textContent=v.f.toFixed(0)+" Hz";
 $("volt").textContent=v.U.toFixed(1)+" V"; $("amm").textContent=v.I.toFixed(3)+" A";
 if(mode==="R"){
  $("Pout").textContent=v.p.toFixed(0)+" Ω";
  $("formula").innerHTML="I = U/R<br>φ = 0°";
  $("results").innerHTML=`R = ${v.p.toFixed(1)} Ω<br>I = ${v.I.toFixed(3)} A<br>φ = 0°`;
  $("explain").innerHTML="<b>Резистор:</b> токът и напрежението са в една фаза. Максимумите и нулевите им стойности настъпват едновременно.";
  $("phaseTxt").textContent="R: φ = 0°";
  $("phasorNote").textContent="U и I са в една фаза";
 }else if(mode==="L"){
  $("Pout").textContent=v.p.toFixed(3)+" H";
  $("formula").innerHTML="X<sub>L</sub> = 2πfL<br>I = U/X<sub>L</sub>";
  $("results").innerHTML=`X<sub>L</sub> = ${v.X.toFixed(2)} Ω<br>I = ${v.I.toFixed(3)} A<br>φ = −90°`;
  $("explain").innerHTML="<b>Индуктивност:</b> напрежението изпреварва тока с 90°. При увеличаване на честотата X<sub>L</sub> нараства и токът намалява.";
  $("phaseTxt").textContent="L: токът изостава с 90°";
  $("phasorNote").textContent="U изпреварва I с 90°";
 }else{
  $("Pout").textContent=v.p.toFixed(1)+" µF";
  $("formula").innerHTML="X<sub>C</sub> = 1/(2πfC)<br>I = U/X<sub>C</sub>";
  $("results").innerHTML=`X<sub>C</sub> = ${v.X.toFixed(2)} Ω<br>I = ${v.I.toFixed(3)} A<br>φ = +90°`;
  $("explain").innerHTML="<b>Капацитет:</b> токът изпреварва напрежението с 90°. При увеличаване на честотата X<sub>C</sub> намалява и токът нараства.";
  $("phaseTxt").textContent="C: токът изпреварва с 90°";
  $("phasorNote").textContent="I изпреварва U с 90°";
 }
 draw();
}

function draw(){
 const v=values();
 const x0=70,x1=590,cy=470,Au=90;
 // normalize current visually but retain correct phase and measured magnitude
 let Ai=Math.max(32,Math.min(70,48+22*Math.tanh((v.I-0.1)*2)));
 let du="",di="",cycles=2;
 for(let x=x0;x<=x1;x+=2){
   let q=(x-x0)/(x1-x0)*cycles*2*Math.PI;
   let yu=cy-Au*Math.sin(theta-q);
   let yi=cy-Ai*Math.sin(theta-q+v.phi);
   du+=(x===x0?"M":"L")+x+" "+yu+" ";
   di+=(x===x0?"M":"L")+x+" "+yi+" ";
 }
 $("waveU").setAttribute("d",du);$("waveI").setAttribute("d",di);
 $("uLevel").setAttribute("y1",cy-Au);$("uLevel").setAttribute("y2",cy-Au);
 $("iLevel").setAttribute("y1",cy-Ai);$("iLevel").setAttribute("y2",cy-Ai);

 // rotating phasors with fixed relative phase
 let ru=92,ri=76,aU=theta,aI=theta+v.phi;
 let ux=745+ru*Math.cos(aU),uy=470-ru*Math.sin(aU);
 let ix=745+ri*Math.cos(aI),iy=470-ri*Math.sin(aI);
 $("phasorU").setAttribute("x2",ux);$("phasorU").setAttribute("y2",uy);
 $("phasorI").setAttribute("x2",ix);$("phasorI").setAttribute("y2",iy);
 $("uPhLab").setAttribute("x",ux+16);$("uPhLab").setAttribute("y",uy-14);
 $("iPhLab").setAttribute("x",ix+16);$("iPhLab").setAttribute("y",iy+22);
}

function animate(t){
 let dt=(t-last)/1000;last=t;
 if(running){
   let f=+$("F").value;
   theta=(theta+dt*2.2*(f/50))%(2*Math.PI);
 }
 draw();requestAnimationFrame(animate);
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;configure()}));
["U","F","P"].forEach(id=>$(id).addEventListener("input",update));
$("pause").addEventListener("click",()=>{running=!running;$("pause").textContent=running?"Пауза":"Продължи"});
$("preset").addEventListener("click",()=>{
 $("U").value=230;$("F").value=50;
 state.R.p=100;state.L.p=0.318;state.C.p=31.8;
 configure();
});
configure();requestAnimationFrame(animate);
</script>
</body></html>
