<script>
const NS="http://www.w3.org/2000/svg", $=id=>document.getElementById(id);
let mode="branch", shorted=false, phase=0;

function line(g,x1,y1,x2,y2,cls="wire"){
 let e=document.createElementNS(NS,"line");e.setAttribute("x1",x1);e.setAttribute("y1",y1);e.setAttribute("x2",x2);e.setAttribute("y2",y2);e.setAttribute("class",cls);g.appendChild(e);return e
}
function txt(g,x,y,s,cls="lab",anchor="middle"){
 let t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.setAttribute("text-anchor",anchor);t.textContent=s;g.appendChild(t);return t
}
function circle(g,x,y,r,cls){
 let c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r);c.setAttribute("class",cls);g.appendChild(c);return c
}
function resistor(g,x,y,w,label,value){
 line(g,x-40,y,x,y);
 let r=document.createElementNS(NS,"rect");r.setAttribute("x",x);r.setAttribute("y",y-18);r.setAttribute("width",w);r.setAttribute("height",36);r.setAttribute("rx",5);r.setAttribute("class","resistor");g.appendChild(r);
 line(g,x+w,y,x+w+40,y);
 txt(g,x+w/2,y-32,label,"lab");txt(g,x+w/2,y+6,value,"small");
}
function meter(g,x,y,label,value){
 circle(g,x,y,44,"meter");txt(g,x,y-7,label,"meterText");txt(g,x,y+17,value,"meterText");
}
function tag(g,x,y,text){
 let r=document.createElementNS(NS,"rect");r.setAttribute("x",x-65);r.setAttribute("y",y-20);r.setAttribute("width",130);r.setAttribute("height",36);r.setAttribute("rx",8);r.setAttribute("class","drop");g.appendChild(r);txt(g,x,y+3,text,"dropTxt");
}
function drawBranch(){
 const g=$("branch");g.innerHTML="";
 const U=+$("U").value,R=+$("R").value,I=U/R;

 // ИЗТОЧНИК: чист учебников символ – кръг със стрелка
 let sc=document.createElementNS(NS,"circle");
 sc.setAttribute("cx",120);sc.setAttribute("cy",305);sc.setAttribute("r",48);
 sc.setAttribute("fill","#0b2941");sc.setAttribute("stroke","#7fd4ff");sc.setAttribute("stroke-width","4");
 sc.setAttribute("filter","drop-shadow(0 0 8px #27d9ff66)");g.appendChild(sc);

 let shaft=document.createElementNS(NS,"line");
 shaft.setAttribute("x1",120);shaft.setAttribute("y1",327);
 shaft.setAttribute("x2",120);shaft.setAttribute("y2",284);
 shaft.setAttribute("stroke","#ffffff");shaft.setAttribute("stroke-width","4");
 shaft.setAttribute("stroke-linecap","round");g.appendChild(shaft);

 let head=document.createElementNS(NS,"path");
 head.setAttribute("d","M120 272 L109 289 L131 289 Z");
 head.setAttribute("fill","#27d9ff");g.appendChild(head);

 txt(g,181,294,"U","lab","start");
 txt(g,181,320,U.toFixed(1)+" V","small","start");

 // Проводници и измервателни уреди
 line(g,120,257,120,135);
 line(g,120,135,235,135);
 meter(g,285,135,"A",I.toFixed(3)+" A");
 line(g,329,135,390,135);

 circle(g,390,135,6,"node");txt(g,390,110,"a","lab");
 line(g,390,135,430,135);

 let rr=document.createElementNS(NS,"rect");
 rr.setAttribute("x",430);rr.setAttribute("y",117);rr.setAttribute("width",130);rr.setAttribute("height",36);
 rr.setAttribute("rx",5);rr.setAttribute("class","resistor");g.appendChild(rr);
 line(g,560,135,600,135);
 txt(g,495,103,"R","resLabel");txt(g,495,141,R+" Ω","resValue");

 circle(g,600,135,6,"node");txt(g,600,110,"b","lab");
 line(g,600,135,680,135);
 line(g,680,135,680,470);
 line(g,680,470,120,470);
 line(g,120,470,120,353);

 // Ясна посока на условния ток
 let ia=document.createElementNS(NS,"path");
 ia.setAttribute("d","M205 135 L185 124 L185 146 Z");
 ia.setAttribute("fill","#27d9ff");g.appendChild(ia);
 txt(g,202,108,"I","lab");

 // Волтметър
 line(g,390,135,390,300);line(g,600,135,600,300);line(g,390,300,450,300);
 meter(g,495,300,"V",U.toFixed(1)+" V");line(g,539,300,600,300);
 txt(g,495,365,"Волтметърът е свързан паралелно на R","small");
 tag(g,495,420,"Uab = "+U.toFixed(1)+" V");

 $("formula").innerHTML=`<span class="eqline">I = <span class="frac"><span class="num">U</span><span class="den">R</span></span></span><span class="eqline">U = R·I</span><span class="eqline">R = <span class="frac"><span class="num">U</span><span class="den">I</span></span></span>`;
 $("results").innerHTML=`U<sub>ab</sub> = ${U.toFixed(1)} V<br>R = ${R.toFixed(1)} Ω<br><br>I = ${U.toFixed(1)} / ${R.toFixed(1)} = <b>${I.toFixed(4)} A</b>`;
 $("explain").innerHTML="Сините движещи се стрелки показват посоката на условния електрически ток I – от положителния към отрицателния полюс във външната верига.";
}

function drawWhole(){
 const g=$("whole");g.innerHTML="";
 const E=+$("E").value,ri=+$("ri").value,Rset=+$("Rw").value,R=shorted?0:Rset,I=E/(R+ri),Ur=I*ri,UR=I*R;
 // Реален източник: идеален източник E (кръг със стрелка) + вътрешно съпротивление r
 txt(g,160,190,"РЕАЛЕН ИЗТОЧНИК","lab");

 let ec=document.createElementNS(NS,"circle");
 ec.setAttribute("cx",125);ec.setAttribute("cy",285);ec.setAttribute("r",45);

 let eshaft=document.createElementNS(NS,"line");
 eshaft.setAttribute("x1",125);eshaft.setAttribute("y1",306);
 eshaft.setAttribute("x2",125);eshaft.setAttribute("y2",268);
 eshaft.setAttribute("stroke","#ffffff");eshaft.setAttribute("stroke-width","4");

 ehead.setAttribute("fill","#27d9ff");g.appendChild(ehead);

 txt(g,180,277,"E","lab","start");
 txt(g,180,301,E.toFixed(1)+" V","small","start");

 // вътрешно съпротивление
 line(g,125,330,125,385);line(g,125,385,145,385);
 let rrint=document.createElementNS(NS,"rect");
 rrint.setAttribute("x",145);rrint.setAttribute("y",367);rrint.setAttribute("width",70);rrint.setAttribute("height",36);
 rrint.setAttribute("rx",5);rrint.setAttribute("class","resistor");g.appendChild(rrint);
 line(g,215,385,265,385);

function segPoint(a,b,t){
 return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
}


function flowArrow(g,a,b,t){
 const p=segPoint(a,b,t);
 const ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
 let tri=document.createElementNS(NS,"path");
 tri.setAttribute("d","M 8 0 L -6 -5 L -6 5 Z");
 tri.setAttribute("class","currentFlow");
 tri.setAttribute("transform",`translate(${p[0]} ${p[1]}) rotate(${ang})`);
 g.appendChild(tri);
}

function drawBranchElectrons(){
 const g=$("markers");g.innerHTML="";
 const U=+$("U").value,R=+$("R").value,I=U/R;
 // Посока на условния ток: от + извода, през товара, към − извода
 const segs=[
   [[120,257],[120,135]],[[120,135],[235,135]],[[329,135],[390,135]],
   [[390,135],[430,135]],[[560,135],[600,135]],[[600,135],[680,135]],
   [[680,135],[680,470]],[[680,470],[120,470]],[[120,470],[120,353]]
 ];
 const speed=0.035+Math.min(0.10,I*0.15), perSeg=2;
 for(let s=0;s<segs.length;s++){
   for(let k=0;k<perSeg;k++){
     let q=(phase*speed+k/perSeg+s*.10)%1;
     flowArrow(g,segs[s][0],segs[s][1],q);
   }
 }
}

function drawWholeElectrons(){
 const g=$("markers");g.innerHTML="";
 const E=+$("E").value,ri=+$("ri").value,Rset=+$("Rw").value,R=shorted?0:Rset,I=E/(R+ri);
 const segs=[
   [[265,230],[355,230]],[[449,230],[520,230]],
   ...(shorted ? [[[520,230],[695,230]]] : [[[520,230],[555,230]],[[655,230],[695,230]]]),
   [[695,230],[730,230]],[[730,230],[730,485]],[[730,485],[265,485]],
   [[265,485],[265,385]]
 ];
 const speed=0.035+Math.min(0.10,I*0.10), perSeg=2;
 for(let s=0;s<segs.length;s++){
   for(let k=0;k<perSeg;k++){
     let q=(phase*speed+k/perSeg+s*.10)%1;
     flowArrow(g,segs[s][0],segs[s][1],q);
   }
 }
}

function markerPoints(){
 if(mode==="branch") return [[180,135],[350,135],[630,135],[680,250],[680,420],[500,470],[250,470],[120,420],[120,300]];
 return [[300,230],[470,230],[650,230],[730,300],[730,450],[600,485],[420,485],[280,485]];
}
function drawMarkers(){
 if(mode==="branch"){drawBranchElectrons();return;}
 drawWholeElectrons();
}
function redraw(){
 $("branch").style.display=mode==="branch"?"":"none";$("whole").style.display=mode==="whole"?"":"none";
 $("branchControls").style.display=mode==="branch"?"":"none";$("wholeControls").style.display=mode==="whole"?"":"none";
 $("uOut").textContent=$("U").value+" V";$("rOut").textContent=$("R").value+" Ω";
 $("eOut").textContent=$("E").value+" V";$("riOut").textContent=(+$("ri").value).toFixed(1)+" Ω";$("rwOut").textContent=(+$("Rw").value).toFixed(1)+" Ω";
 if(mode==="branch")drawBranch();else drawWhole();drawMarkers();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));redraw()});
