<div class="ctrl">Iф = <input id="I" type="range" min="1" max="20" value="10"> <span id="iv">10 A</span> &nbsp; <label><input id="run" type="checkbox" checked=""> движение</label></div></div>
<div><div class="card"><canvas id="ph" width="545" height="387"></canvas></div><div class="card" style="margin-top:14px">
<div class="f">Uл = Uф</div><div class="f">При симетричен товар: Iл = √3 · Iф</div><div class="f" id="calc">При Iф = 10 A → Iл = 17.32 A</div><div class="info" id="info"><b>Запомнете:</b> при симетричен Δ: Uл = Uф, Iл = √3·Iф, а линейният и съответният фазов ток са отместени на 30°.</div>
</div></div></div></div>
<script>
const o=document.getElementById('ov'),c=o.getContext('2d'),p=document.getElementById('ph'),q=p.getContext('2d'),I=document.getElementById('I');let m=0,t=0,last=0;
const C=['#c92525','#2359ad','#21843f'],ink='#17212b';
function fit(x,z){let r=x.getBoundingClientRect(),d=devicePixelRatio||1;x.width=r.width*d;x.height=r.height*d;z.setTransform(d,0,0,d,0,0)}
function line(z,a,b,d,e,col=ink,w=2){z.strokeStyle=col;z.lineWidth=w;z.lineCap='round';z.beginPath();z.moveTo(a,b);z.lineTo(d,e);z.stroke()}
function ar(z,a,b,d,e,col=ink,w=2){line(z,a,b,d,e,col,w);let A=Math.atan2(e-b,d-a),s=8;z.fillStyle=col;z.beginPath();z.moveTo(d,e);z.lineTo(d-s*Math.cos(A-.45),e-s*Math.sin(A-.45));z.lineTo(d-s*Math.cos(A+.45),e-s*Math.sin(A+.45));z.fill()}
function tx(z,s,x,y,n=15,col=ink){z.fillStyle=col;z.font='bold '+n+'px Arial';z.textAlign='center';z.textBaseline='middle';z.fillText(s,x,y)}
function dot(z,x,y,col){z.fillStyle=col;z.beginPath();z.arc(x,y,4.5,0,7);z.fill()}
function overlay(){
 let w=o.clientWidth,h=o.clientHeight;c.clearRect(0,0,w,h);let A=[w*(260/1400),h*(80/600)],B=[w*(500/1400),h*(370/600)],D=[w*(80/1400),h*(370/600)],prog=(t/6.283)%1;
 if(m===1){tx(c,'Uл = Uф',w*.68,h*.10,19,'#174d96');ar(c,w*.61,h*.18,w*.61,h*.47,ink);ar(c,w*.61,h*.76,w*.61,h*.52,ink)}
 if(m===2){
   let pts=[[A,B],[B,D],[D,A]];
   pts.forEach((v,k)=>{let u=(prog+k/3)%1,x=v[0][0]+(v[1][0]-v[0][0])*u,y=v[0][1]+(v[1][1]-v[0][1])*u,dx=v[1][0]-v[0][0],dy=v[1][1]-v[0][1],L=Math.hypot(dx,dy);ar(c,x-dx/L*18,y-dy/L*18,x+dx/L*18,y+dy/L*18,C[k],2.5)});
   tx(c,'Iф – ток през фазовия клон',w*.68,h*.10,17,'#174d96');
 }
 if(m===3){let x=A[0]+(w*.93-A[0])*prog;ar(c,x-22,A[1]-13,x+22,A[1]-13,C[0],2.5);tx(c,'Iл = √3 · Iф  (симетричен Δ)',w*.68,h*.10,18,'#174d96')}
 if(m===0){let pts=[A,B,D,A];for(let k=0;k<3;k++){let u=(prog+k/3)%1,s=Math.floor(u*3),v=u*3-s,P=pts[s],Q=pts[s+1];dot(c,P[0]+(Q[0]-P[0])*v,P[1]+(Q[1]-P[1])*v,C[k])}}
}
function phasor(){
 let w=p.clientWidth,h=p.clientHeight;q.clearRect(0,0,w,h);
 let x=w/2,y=h*.53,R=Math.min(w,h)*.31;
 line(q,25,y,w-25,y,'#dde4eb',1);line(q,x,40,x,h-25,'#dde4eb',1);

 let title = m===3 ? 'Линейни токове' : (m===2 ? 'Фазови токове' : 'Напрежения');
 tx(q,title,x,20,18,'#174d96');

 let angles, names;
 if(m===3){
   // При симетричен Δ: линейният ток е √3 пъти по-голям
   // и изостава с 30° от съответния фазов ток при приетата последователност ABC.
   angles=[-Math.PI/6, -5*Math.PI/6, Math.PI/2];
   names=['IлA','IлB','IлC'];
 } else if(m===2){
   angles=[0,-2*Math.PI/3,2*Math.PI/3];
   names=['IфAB','IфBC','IфCA'];
 } else {
   angles=[0,-2*Math.PI/3,2*Math.PI/3];
   names=['UAB','UBC','UCA'];
 }

 angles.forEach((a,k)=>{
   a+=t*.15;
   ar(q,x,y,x+R*Math.cos(a),y-R*Math.sin(a),C[k],3);
   tx(q,names[k],x+(R+27)*Math.cos(a),y-(R+27)*Math.sin(a),13,C[k]);
 });
 tx(q,'120°',x+35,y+42,14);

 if(m===3){
   tx(q,'Iл = √3·Iф',x,h-35,16,'#174d96');
   tx(q,'изместване 30°',x,h-15,14,'#444');
 }
}
function draw(){document.getElementById('iv').textContent=I.value+' A';document.getElementById('calc').textContent='При Iф = '+I.value+' A → Iл = '+(Math.sqrt(3)*I.value).toFixed(2)+' A';
let info=document.getElementById('info');info.innerHTML=m===1?'<b>Напрежения:</b> Uл = Uф, защото всяка фаза е включена директно между два линейни проводника.':m===2?'<b>Фазов ток:</b> Iф протича през отделния клон на триъгълника.':m===3?'<b>Линеен ток при симетричен Δ:</b> Iл е векторна разлика на два фазови тока, Iл = √3·Iф и е отместен с 30° спрямо съответния фазов ток.':'<b>Запомнете:</b> при симетричен Δ: Uл = Uф, Iл = √3·Iф, а линейният и съответният фазов ток са отместени на 30°.';overlay();phasor()}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;document.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()});I.oninput=draw;
function resize(){fit(o,c);fit(p,q);draw()}window.onresize=resize;resize();function loop(s){if(document.getElementById('run').checked)t+=Math.min((s-last)/1000,.04)*1.2;last=s;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
