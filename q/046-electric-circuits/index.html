<style>
*{box-sizing:border-box}

.wire{stroke:#111;stroke-width:3;fill:none}

.current{stroke:#d62020;stroke-width:2.2;fill:none}
.currentText{fill:#d62020;font-size:18px;font-weight:700}
.label{fill:#111;font-size:22px}

.branchOutline{fill:none;stroke-width:4;stroke-dasharray:12 9;rx:18;opacity:0}

.nodeHalo{fill:none;stroke:#1769c2;stroke-width:9;opacity:0}
.nodeTag{font-size:20px;font-weight:800;fill:#1769c2;opacity:0}
.pulse{animation:pulse 1s ease-in-out infinite}
.flow{animation:dash 1.2s linear infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-42}}
@media(max-width:760px){h1{font-size:25px}.label{font-size:18px}.nodeLabel{font-size:22px}}

<body>

<g id="currentFlow"><g><line stroke="#d62020" stroke-width="2.4" marker-end="url(#arrRed)" x1="220" y1="420.09041999999994" x2="220" y2="388.09041999999994"></line><text fill="#d62020" font-size="17" font-weight="700" x="238" y="410.09041999999994">I₁</text></g><g><line stroke="#d62020" stroke-width="2.4" marker-end="url(#arrRed)" x1="220" y1="225.09041999999994" x2="220" y2="193.09041999999994"></line><text fill="#d62020" font-size="17" font-weight="700" x="238" y="215.09041999999994">I₁</text></g><g><line stroke="#d62020" stroke-width="2.4" marker-end="url(#arrRed)" x1="500" y1="194.8280200000001" x2="500" y2="226.8280200000001"></line><text fill="#d62020" font-size="17" font-weight="700" x="518" y="216.8280200000001">I₂</text></g><g><line stroke="#d62020" stroke-width="2.4" marker-end="url(#arrRed)" x1="500" y1="399.8280200000001" x2="500" y2="431.8280200000001"></line><text fill="#d62020" font-size="17" font-weight="700" x="518" y="421.8280200000001">I₂</text></g><g><line stroke="#d62020" stroke-width="2.4" marker-end="url(#arrRed)" x1="780" y1="194.8280200000001" x2="780" y2="226.8280200000001"></line><text fill="#d62020" font-size="17" font-weight="700" x="798" y="216.8280200000001">I₃</text></g><g><line stroke="#d62020" stroke-width="2.4" marker-end="url(#arrRed)" x1="780" y1="399.8280200000001" x2="780" y2="431.8280200000001"></line><text fill="#d62020" font-size="17" font-weight="700" x="798" y="421.8280200000001">I₃</text></g><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="220" y1="427.3766955999996" x2="220" y2="407.3766955999996"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="220" y1="362.3766956000005" x2="220" y2="342.3766956000005"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="220" y1="297.37669560000006" x2="220" y2="277.37669560000006"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="220" y1="232.3766955999996" x2="220" y2="212.3766955999996"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="220" y1="167.37669560000052" x2="220" y2="147.37669560000052"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="220" y1="492.37669560000006" x2="220" y2="472.37669560000006"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="500" y1="186.86039693333373" x2="500" y2="206.86039693333373"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="500" y1="255.19373026666608" x2="500" y2="275.1937302666661"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="500" y1="323.5270635999999" x2="500" y2="343.5270635999999"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="500" y1="391.86039693333373" x2="500" y2="411.86039693333373"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="500" y1="460.1937302666661" x2="500" y2="480.1937302666661"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="500" y1="118.5270635999999" x2="500" y2="138.5270635999999"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="186.86039693333373" x2="780" y2="206.86039693333373"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="255.19373026666608" x2="780" y2="275.1937302666661"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="323.5270635999999" x2="780" y2="343.5270635999999"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="391.86039693333373" x2="780" y2="411.86039693333373"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="460.1937302666661" x2="780" y2="480.1937302666661"></line><line stroke="#d62020" stroke-width="1.8" marker-end="url(#arrRed)" opacity="0.88" x1="780" y1="118.5270635999999" x2="780" y2="138.5270635999999"></line></g>
</svg>

<div id="info" class="info">
<b>Разклонена електрическа верига.</b> На схемата са показани два възела A и B, три клона и три възможни затворени контура. Червените стрелки и движещите се означения I показват условно избраните посоки на електрическите токове.
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const info=$('info');
const nodeEls=[$('haloA'),$('haloB'),$('nodeTagA'),$('nodeTagB')];
const branchEls=[$('br1'),$('br2'),$('br3'),$('brt1'),$('brt2'),$('brt3')];
const loopEls=[$('loop1'),$('loop2'),$('loop3'),$('loopt1'),$('loopt2'),$('loopt3')];
const buttons=[$('nodesBtn'),$('branchesBtn'),$('loopsBtn'),$('allBtn')];

function off(){
  buttons.forEach(b=>b.classList.remove('on'));
  nodeEls.forEach(e=>{e.style.opacity=0;e.classList.remove('pulse')});
  branchEls.forEach(e=>{e.style.opacity=0;e.classList.remove('pulse')});
  loopEls.forEach(e=>{e.style.opacity=0;e.classList.remove('flow','pulse')});
}
$('nodesBtn').onclick=()=>{
  off(); $('nodesBtn').classList.add('on');
  nodeEls.forEach(e=>{e.style.opacity=1;e.classList.add('pulse')});
  info.innerHTML='<b>Възел.</b> Точка или съвкупност от непосредствено свързани точки, в която се съединяват три или повече клона. На схемата възлите са A и B.';
};
$('branchesBtn').onclick=()=>{
  off(); $('branchesBtn').classList.add('on');
  branchEls.forEach(e=>{e.style.opacity=1;e.classList.add('pulse')});
  info.innerHTML='<b>Клон.</b> Участък между два възела, през всички елементи на който протича един и същ ток. Показани са Клон 1 (R₁, E₁), Клон 2 (R₂) и Клон 3 (R₃, E₂).';
};
$('loopsBtn').onclick=()=>{
  off(); $('loopsBtn').classList.add('on');
  loopEls.forEach(e=>{e.style.opacity=1;e.classList.add('flow')});
  info.innerHTML='<b>Контур.</b> Затворен път, образуван от последователно свързани клони. В тази схема могат да се проследят три контура: 1–2, 2–3 и външният 1–3.';
};
$('allBtn').onclick=()=>{
  off(); $('allBtn').classList.add('on');
  nodeEls.forEach(e=>{e.style.opacity=1;e.classList.add('pulse')});
  branchEls.forEach(e=>{e.style.opacity=.95});
  loopEls.forEach(e=>{e.style.opacity=.85;e.classList.add('flow')});
  info.innerHTML='<b>Обобщение.</b> Схемата съдържа два възела A и B, три клона и три възможни контура. Движещите се стрелки показват условните посоки на клоновите токове I₁, I₂ и I₃.';
};
$('clearBtn').onclick=()=>{
  off();
  info.innerHTML='<b>Разклонена електрическа верига.</b> Чиста схема с два възела A и B и три клона.';
};

/* Animated conventional-current arrows.
   I1 enters node A; I2 and I3 leave node A, illustrating I1 = I2 + I3. */
const flowG=$('currentFlow');
const NS='http://www.w3.org/2000/svg';

const currentPaths=[
  {id:'I₁', pts:[[220,500],[220,110]], speed:0.22},
  {id:'I₂', pts:[[500,110],[500,520]], speed:0.22},
  {id:'I₃', pts:[[780,110],[780,520]], speed:0.22}
];

function interpFlow(pts,t){
  let lens=[],total=0;
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1];
    const l=Math.hypot(dx,dy); lens.push(l); total+=l;
  }
  let d=(t%1)*total;
  for(let i=0;i<lens.length;i++){
    if(d<=lens[i]){
      const a=pts[i],b=pts[i+1],u=d/lens[i];
      return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
    }
    d-=lens[i];
  }
  return pts[pts.length-1];
}

const movers=[];
currentPaths.forEach((p,pi)=>{
  // Two moving arrow+I markers per branch.
  for(let j=0;j<2;j++){
    const group=document.createElementNS(NS,'g');

    const shaft=document.createElementNS(NS,'line');
    shaft.setAttribute('stroke','#d62020');
    shaft.setAttribute('stroke-width','2.4');
    shaft.setAttribute('marker-end','url(#arrRed)');
    group.appendChild(shaft);

    const label=document.createElementNS(NS,'text');
    label.setAttribute('fill','#d62020');
    label.setAttribute('font-size','17');
    label.setAttribute('font-weight','700');
    label.textContent=p.id;
    group.appendChild(label);

    flowG.appendChild(group);
    movers.push({group,shaft,label,p,phase:j/2});
  }
});


// Additional small red arrows without labels.
// They circulate continuously in the same conventional-current direction.
const smallMovers=[];
currentPaths.forEach((p,pi)=>{
  for(let j=0;j<6;j++){
    const shaft=document.createElementNS(NS,'line');
    shaft.setAttribute('stroke','#d62020');
    shaft.setAttribute('stroke-width','1.8');
    shaft.setAttribute('marker-end','url(#arrRed)');
    shaft.setAttribute('opacity','0.88');
    flowG.appendChild(shaft);
    smallMovers.push({shaft,p,phase:(j+0.25)/6});
  }
});

let flowStart=performance.now();
function animateCurrent(now){
  const T=(now-flowStart)/1000;
  movers.forEach(o=>{
    const t=o.phase+T*o.p.speed;
    const [x,y]=interpFlow(o.p.pts,t);
    const [x2,y2]=interpFlow(o.p.pts,t+0.035);

    // Arrow points in the conventional-current direction.
    const dx=x2-x, dy=y2-y;
    const len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    const half=16;

    o.shaft.setAttribute('x1',x-ux*half);
    o.shaft.setAttribute('y1',y-uy*half);
    o.shaft.setAttribute('x2',x+ux*half);
    o.shaft.setAttribute('y2',y+uy*half);

    o.label.setAttribute('x',x+18);
    o.label.setAttribute('y',y+6);
  });

  smallMovers.forEach(o=>{
    const t=o.phase+T*(o.p.speed*1.18);
    const [x,y]=interpFlow(o.p.pts,t);
    const [x2,y2]=interpFlow(o.p.pts,t+0.028);
    const dx=x2-x, dy=y2-y;
    const len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    const half=10;
    o.shaft.setAttribute('x1',x-ux*half);
    o.shaft.setAttribute('y1',y-uy*half);
    o.shaft.setAttribute('x2',x+ux*half);
    o.shaft.setAttribute('y2',y+uy*half);
  });

  requestAnimationFrame(animateCurrent);
}
requestAnimationFrame(animateCurrent);
</script>
