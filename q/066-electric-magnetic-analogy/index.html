<div class="c"><div class="row">
<div><label><span>U</span><span id="uv">100 V</span></label><input id="U" type="range" min="10" max="240" value="100" step="5"></div>
<div><label><span>R</span><span id="rv">20 Ω</span></label><input id="R" type="range" min="1" max="100" value="20"></div>
<div><label><span>N</span><span id="nv">100</span></label><input id="N" type="range" min="10" max="500" value="100" step="10"></div>
<div><label><span>Rₘ</span><span id="rmv">1000 A·нав./Wb</span></label><input id="Rm" type="range" min="100" max="5000" value="1000" step="100"></div></div>
<div class="res"><div class="r">I = U/R<b id="iv">5.00 A</b></div><div class="r">Θ = N·I<b id="th">500.0 A·нав.</b></div><div class="r">Φ = Θ/Rₘ<b id="ph">0.500 Wb</b></div></div>
<button id="pause">Ⅱ Пауза</button>
<div class="a"><b>U ↔ Θ</b> &nbsp;&nbsp; <b>I ↔ Φ</b> &nbsp;&nbsp; <b>R ↔ Rₘ</b><br>I = U/R &nbsp; ⇔ &nbsp; Φ = Θ/Rₘ</div>
</div></div>
<script>
const o=document.getElementById('o');let q=0,stop=false;
function dot(cl,x,y){let z=document.createElement('div');z.className='d '+cl;z.style.left=x*100+'%';z.style.top=y*100+'%';o.appendChild(z)}
function pt(P,t){let L=[],S=0;for(let i=0;i<P.length-1;i++){let l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);L.push(l);S+=l}let d=(t%1)*S,i=0;while(i<L.length-1&&d>L[i]){d-=L[i];i++}let a=d/L[i];return[P[i][0]+a*(P[i+1][0]-P[i][0]),P[i][1]+a*(P[i+1][1]-P[i][1])]}
function draw(){o.innerHTML='';let u=+U.value,r=+R.value,n=+N.value,rm=+Rm.value,I=u/r,T=n*I,F=T/rm;
// Електроните се движат само по реално изчертаните проводници от фигурата.
// Отделяме проводниковите участъци от източника и резистора, за да няма точки извън линиите.
const wires=[
  [[.111,.188],[.274,.188]],   // горен проводник
  [[.286,.188],[.286,.305]],   // десен горен вертикален участък
  [[.286,.485],[.286,.599]],   // десен долен вертикален участък
  [[.286,.599],[.111,.599]],   // долен проводник
  [[.111,.599],[.111,.472]],   // ляв долен вертикален участък
  [[.111,.337],[.111,.188]]    // ляв горен вертикален участък
];
const esp=.004+Math.min(.010,I*.00065);
for(let s=0;s<wires.length;s++){
  const P=wires[s];
  for(let k=0;k<3;k++){
    const p=pt(P,q*esp+k/3);
    dot('e',p[0],p[1]);
  }
}

const M=[[.655,.205],[.823,.205],[.823,.70],[.655,.70],[.655,.205]];
for(let k=0;k<10;k++){let p=pt(M,q*(.0012+Math.min(.006,Math.abs(F)*.002))+k/10);dot('m',p[0],p[1])}
uv.textContent=u+' V';rv.textContent=r+' Ω';nv.textContent=n;rmv.textContent=rm+' A·нав./Wb';iv.textContent=I.toFixed(2)+' A';th.textContent=T.toFixed(1)+' A·нав.';ph.textContent=F.toFixed(3)+' Wb'}
[U,R,N,Rm].forEach(x=>x.oninput=draw);pause.onclick=()=>{stop=!stop;pause.textContent=stop?'▶ Продължи':'Ⅱ Пауза'};function loop(){if(!stop)q++;draw();requestAnimationFrame(loop)}draw();loop();
</script></body></html>
